name: Deploy Questions

on:
  push:
    branches:
      - main
      
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Prepare
      run: |
        export QUESTIONS_FOLDER="$PWD/questions"
        git clone https://github.com/gurukulams/practice-js.git

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'practice-js/package-lock.json'

    - name: Build
      run: |
        cd practice-js
        npm i
        npm run build:questions

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: practice-js/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4